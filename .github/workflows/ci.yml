name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID || '' }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN || '' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'hello@example.com' }}
      CHURCH_EMAIL: ${{ secrets.CHURCH_EMAIL || 'hello@example.com' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'dev-secret' }}
      NEXTAUTH_URL: https://example.com
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'changeme' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build app
        run: npx next build

  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
